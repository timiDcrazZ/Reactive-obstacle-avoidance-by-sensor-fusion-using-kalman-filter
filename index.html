<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone Dashboard — Obstacle Avoidance</title>
<meta name="description" content="Real-time drone sensor dashboard with 3D attitude, radar obstacle display, and adaptive safety distance.">
<style>
:root{
  --ink:#0c1822; --panel:#13232f; --line:#274152; --text:#e4edf3; --dim:#8aa2b2;
  --ok:#5cc8a8; --warn:#f2b84b; --bad:#e5584d; --arrow:#ff3b30;
  --radar-bg:#0a1a10; --radar-grid:#1a4a28; --dot1:#00ff88; --dot2:#ffaa00;
  --safe:#5cc8a8; --caution:#f2b84b; --danger:#e5584d;
  --font:"Avenir Next","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--font);padding:18px;min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:20px;font-weight:600}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text]{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;font-size:14px;width:170px}
button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
button:hover{border-color:var(--dim)}
button.primary{background:var(--warn);border-color:var(--warn);color:#1b1500;font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
#status{font-size:13px;color:var(--dim)} #status.ok{color:var(--ok)} #status.err{color:var(--bad)}

main{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){main{grid-template-columns:1fr}}

/* ── Panel shell ── */
.win{background:var(--panel);border:1px solid var(--line);border-radius:10px;height:560px;display:flex;flex-direction:column;overflow:hidden}
.win>h2{font-size:15px;font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.opts{display:flex;gap:12px;font-size:12px;color:var(--dim);font-weight:400;align-items:center}
.opts label{display:flex;gap:4px;align-items:center;cursor:pointer}
.opts button{padding:3px 8px;font-size:12px}

/* ── 3D stage (left panel) ── */
#stage{flex:1;position:relative;min-height:0}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
.readout{position:absolute;left:14px;bottom:12px;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;line-height:1.6}
.readout b{color:var(--text);font-weight:500}

/* ── Right panel layout ── */
.obst-panel{flex:1;display:flex;flex-direction:row;gap:0;overflow:hidden}

/* ── Radar pane (left half of right panel) ── */
.radar-pane{
  flex:0 0 55%;
  display:flex;flex-direction:column;
  background:var(--radar-bg);
  border-right:1px solid var(--line);
  position:relative;overflow:hidden;
}
.radar-title{
  font-size:11px;color:var(--dim);text-align:center;
  padding:6px 4px 3px;letter-spacing:.05em;text-transform:uppercase;
  border-bottom:1px solid var(--line);
}
#radarCanvas{width:100%;flex:1;display:block}

/* Radar legend */
.radar-legend{
  display:flex;gap:14px;justify-content:center;padding:5px 8px;
  font-size:11px;color:var(--dim);border-top:1px solid var(--line);
}
.legend-dot{
  width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle;
}

/* ── Safety status banner ── */
.safety-banner{
  position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
  background:rgba(12,24,34,0.85);border:1px solid var(--line);border-radius:6px;
  font-size:11px;padding:3px 10px;white-space:nowrap;z-index:10;
  transition:background .3s,border-color .3s,color .3s;
}
.safety-banner.safe{border-color:var(--safe);color:var(--safe)}
.safety-banner.caution{border-color:var(--caution);color:var(--caution)}
.safety-banner.danger{border-color:var(--danger);color:var(--danger)}

/* ── Bar pane (right half of right panel) ── */
.bar-pane{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;padding:14px 8px 10px;overflow:auto;
}
.side{display:flex;flex-direction:column;align-items:center;gap:6px}
.side>span{font-size:12px;color:var(--dim)}
.bars{display:flex;gap:8px}
.bar{display:flex;flex-direction:column;align-items:center;gap:5px;width:42px}
.bar .v{font-size:14px;font-variant-numeric:tabular-nums;height:18px}
.bar .t{width:100%;height:160px;background:#0a141c;border:1px solid var(--line);border-radius:6px;position:relative;overflow:hidden}
.bar .f{position:absolute;left:0;right:0;bottom:0;height:100%;transform-origin:bottom;transform:scaleY(0);will-change:transform;background:var(--ok)}
.bar .f.warn{background:var(--warn)} .bar .f.bad{background:var(--bad)}
.bar.stale{opacity:.45}
.bar .n{font-size:11px;color:var(--dim)}

.divider{width:80%;height:1px;background:var(--line)}

/* Adaptive distance info */
.adap-info{
  font-size:11px;color:var(--dim);text-align:center;padding:0 6px;line-height:1.5;
}
.adap-info b{color:var(--warn)}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Drone Dashboard</h1>
  <div class="ctl">
    <span id="status">Not connected</span>
    <input type="text" id="ip" placeholder="ESP32 IP e.g. 192.168.1.42" aria-label="ESP32 IP address">
    <button class="primary" id="btnConn">Connect</button>
    <button id="btnDemo">Demo</button>
  </div>
</header>

<main>
  <!-- LEFT PANEL: 3D State Estimation -->
  <section class="win">
    <h2>State estimation
      <span class="opts">
        <label><input type="checkbox" id="invYaw"> flip yaw</label>
        <label><input type="checkbox" id="invPitch"> flip pitch</label>
        <label><input type="checkbox" id="invRoll"> flip roll</label>
        <button id="btnZero">Zero heading</button>
      </span>
    </h2>
    <div id="stage">
      <div class="readout">Pitch <b id="rP">--</b>&deg; &nbsp; Roll <b id="rR">--</b>&deg; &nbsp; Yaw <b id="rY">--</b>&deg;</div>
    </div>
  </section>

  <!-- RIGHT PANEL: Obstacle Avoidance -->
  <section class="win">
    <h2>Obstacle avoidance
      <span class="opts" id="safeDistLabel">Safe dist: <b id="sdVal">30</b> cm &plusmn;5</span>
    </h2>
    <div class="obst-panel">

      <!-- Radar pane -->
      <div class="radar-pane">
        <div class="radar-title">Obstacle Radar View</div>
        <canvas id="radarCanvas"></canvas>
        <div class="safety-banner safe" id="safetyBanner">SAFE</div>
        <div class="radar-legend">
          <span><span class="legend-dot" style="background:var(--dot1)"></span>Pair 1 (TOF1+U1)</span>
          <span><span class="legend-dot" style="background:var(--dot2)"></span>Pair 2 (TOF2+U2)</span>
        </div>
      </div>

      <!-- Bar pane -->
      <div class="bar-pane">
        <div class="side" id="sideL"><div class="bars"></div><span>Left (Pair 1)</span></div>
        <div class="divider"></div>
        <div class="side" id="sideR"><div class="bars"></div><span>Right (Pair 2)</span></div>
        <div class="adap-info" id="adapInfo">Adaptive safe dist: <b id="adaptVal">--</b> cm</div>
      </div>

    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─────────────────────────────────────────────────────────────────────────
// Utilities
// ─────────────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const store = {
  get(k,d){ try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d} },
  set(k,v){ try{localStorage.setItem(k,v)}catch(e){} }
};
const D2R = Math.PI / 180;
const MAX_CM = 200, WARN_CM = 60, BAD_CM = 30;
const ANGLE_DEADBAND = 1.5;
const TAU_ATT = 0.07, TAU_BAR = 0.20;

// ─────────────────────────────────────────────────────────────────────────
// Adaptive Safety Distance
// BASE_SAFE_CM: nominal minimum approach distance
// ADAPT_MARGIN: ±cm tolerance band
// approach_speed: how fast object is closing (cm/s); drives adaptive bump
// ─────────────────────────────────────────────────────────────────────────
const BASE_SAFE_CM  = 30;
const ADAPT_MARGIN  = 5;
let adaptSafeDist   = BASE_SAFE_CM;  // dynamic — grows when object approaches fast
let prevDist1 = null, prevDist2 = null, prevDistTime = null;

function updateAdaptiveSafeDist(d1, d2) {
  const now = performance.now() / 1000;
  if (prevDistTime !== null && now - prevDistTime < 2.0) {
    const dt = now - prevDistTime;
    if (dt > 0.01) {
      let maxApproach = 0;
      if (d1 > 0 && prevDist1 > 0) maxApproach = Math.max(maxApproach, (prevDist1 - d1) / dt);
      if (d2 > 0 && prevDist2 > 0) maxApproach = Math.max(maxApproach, (prevDist2 - d2) / dt);
      // Adaptive bump: if closing > 20 cm/s, extend safe distance up to +40 cm
      const bump = Math.max(0, Math.min(40, maxApproach * 2.0));
      // Low-pass toward target
      adaptSafeDist += ((BASE_SAFE_CM + bump) - adaptSafeDist) * 0.12;
    }
  }
  prevDist1 = d1; prevDist2 = d2; prevDistTime = now;
  $('adaptVal').textContent = Math.round(adaptSafeDist);
}

// ─────────────────────────────────────────────────────────────────────────
// Obstacle bars (right side bars)
// ─────────────────────────────────────────────────────────────────────────
const bars = {};
[['L','sideL','c1'],['R','sideR','c2']].forEach(([side, el, ch]) => {
  [['ultra','Ultrasonic','U'],['tof','ToF','ToF'],['kalman','Fused','Fused']].forEach(([k, long, short]) => {
    const wrap = document.createElement('div'); wrap.className = 'bar stale';
    wrap.innerHTML = `<div class="v">--</div><div class="t"><div class="f"></div></div><div class="n" title="${long}">${short}</div>`;
    $(el).querySelector('.bars').appendChild(wrap);
    bars[side+k] = {key: ch+'_'+k, el: wrap, v: wrap.querySelector('.v'), f: wrap.querySelector('.f'),
                    target: null, shown: null, text: '', cls: ''};
  });
});

// ─────────────────────────────────────────────────────────────────────────
// 3D scene (left panel)
// ─────────────────────────────────────────────────────────────────────────
const stage = $('stage');
let renderer, scene, camera, body, haveGL = typeof THREE !== 'undefined';
const cur = haveGL ? new THREE.Quaternion() : null, tgt = haveGL ? new THREE.Quaternion() : null;
if (haveGL) {
  renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  stage.prepend(renderer.domElement);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
  camera.position.set(3.6, 3.4, -6.2); camera.lookAt(0,0,0);
  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  const dl = new THREE.DirectionalLight(0xffffff, 0.8); dl.position.set(3,6,-2); scene.add(dl);
  const grid = new THREE.GridHelper(8,16,0x3b5b70,0x20384a); grid.position.y=-1.3; scene.add(grid);
  body = new THREE.Group();
  const box = new THREE.Mesh(new THREE.BoxGeometry(1.3,0.34,2.4),
    new THREE.MeshStandardMaterial({color:0x5f8fb0, roughness:.55, metalness:.1}));
  body.add(box);
  body.add(new THREE.LineSegments(new THREE.EdgesGeometry(box.geometry),
    new THREE.LineBasicMaterial({color:0xcfe6f5})));
  const red = new THREE.MeshStandardMaterial({color:0xff3b30, roughness:.4});
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.8,16), red);
  shaft.rotation.x = Math.PI/2; shaft.position.z = 1.6; body.add(shaft);
  const head = new THREE.Mesh(new THREE.ConeGeometry(0.2,0.45,20), red);
  head.rotation.x = Math.PI/2; head.position.z = 2.02; body.add(head);
  scene.add(body);
  const fit = () => {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  };
  new ResizeObserver(fit).observe(stage); fit();
} else {
  stage.insertAdjacentHTML('afterbegin','<p style="padding:20px;color:#e5584d">3D library failed to load.</p>');
}

const AX = haveGL?new THREE.Vector3(1,0,0):null;
const AY = haveGL?new THREE.Vector3(0,1,0):null;
const AZ = haveGL?new THREE.Vector3(0,0,1):null;
const qa = haveGL?new THREE.Quaternion():null;
const qb = haveGL?new THREE.Quaternion():null;
const qc = haveGL?new THREE.Quaternion():null;
let yawZero = parseFloat(store.get('yawZero','0'))||0, lastYaw=0, haveAtt=false;
['invYaw','invPitch','invRoll'].forEach(id => {
  $(id).checked = store.get(id,'0')==='1';
  $(id).onchange = () => store.set(id,$(id).checked?'1':'0');
});
$('btnZero').onclick = () => { yawZero = lastYaw; store.set('yawZero', String(yawZero)); };

const shownAng={pitch:null,roll:null,yaw:null}, smoothAng={pitch:null,roll:null,yaw:null};
function stepAng(key,v){
  let m = smoothAng[key];
  m = m===null ? v : m+(((v-m+540)%360)-180)*0.15;
  smoothAng[key]=m;
  const s=shownAng[key];
  if(s===null) return(shownAng[key]=Math.round(m));
  const d=((m-s+540)%360)-180;
  if(Math.abs(d)>ANGLE_DEADBAND) shownAng[key]=Math.round(m);
  return shownAng[key];
}
const norm360=x=>((x%360)+360)%360, norm180=x=>norm360(x+180)-180;
function setAttitude(pitch,roll,yaw){
  pitch=stepAng('pitch',pitch); roll=stepAng('roll',roll); yaw=stepAng('yaw',yaw);
  lastYaw=yaw; haveAtt=true;
  $('rP').textContent=norm180(pitch); $('rR').textContent=norm180(roll); $('rY').textContent=norm360(yaw);
  if(!haveGL) return;
  const sy=-1*($('invYaw').checked?-1:1);
  const sp=-1*($('invPitch').checked?-1:1);
  const sr= 1*($('invRoll').checked?-1:1);
  qa.setFromAxisAngle(AY,(yaw-yawZero)*D2R*sy);
  qb.setFromAxisAngle(AX,pitch*D2R*sp);
  qc.setFromAxisAngle(AZ,roll*D2R*sr);
  tgt.copy(qa).multiply(qb).multiply(qc);
  if(haveAtt&&!setAttitude.first){cur.copy(tgt); setAttitude.first=true;}
}

// ─────────────────────────────────────────────────────────────────────────
// RADAR — canvas-based radar view
//
// Layout: drone icon at bottom-centre, obstacles painted as glowing dots
// at their real scaled distance above. The radar sweep arc shows the field
// of view. Two sensor pairs: Pair 1 (TOF1+U1) on the left channel, Pair 2
// (TOF2+U2) on the right channel. Dots disappear when distance > adaptSafeDist*3.
// ─────────────────────────────────────────────────────────────────────────
const rc = $('radarCanvas');
const rctx = rc.getContext('2d');

// Radar dot trail history for each pair
const TRAIL_LEN = 18;
const trail1 = []; // {x,y,age} for pair 1
const trail2 = []; // {x,y,age} for pair 2

// Current smoothed distances for radar drawing
let rDist1 = -1, rDist2 = -1;

function resizeRadar() {
  const parent = rc.parentElement;
  const h = parent.clientHeight - 36; // subtract title + legend
  rc.width  = parent.clientWidth;
  rc.height = Math.max(h, 80);
}
new ResizeObserver(resizeRadar).observe(rc.parentElement);
resizeRadar();

function drawRadar(d1, d2) {
  const W = rc.width, H = rc.height;
  rctx.clearRect(0,0,W,H);

  // Background gradient
  const bg = rctx.createRadialGradient(W/2,H,0,W/2,H,Math.max(W,H)*0.9);
  bg.addColorStop(0,'#0a1a10'); bg.addColorStop(1,'#060e0a');
  rctx.fillStyle = bg; rctx.fillRect(0,0,W,H);

  const cx = W/2, cy = H - 28;  // drone sits near bottom
  const maxR = Math.min(W*0.48, H-50);

  // ── Range rings ──
  const rings = [0.25, 0.5, 0.75, 1.0];
  rings.forEach((f,i) => {
    const r = f * maxR;
    rctx.beginPath();
    rctx.arc(cx, cy, r, Math.PI, 2*Math.PI);
    rctx.strokeStyle = i===rings.length-1 ? '#2a6040' : '#1a4028';
    rctx.lineWidth = i===rings.length-1 ? 1.5 : 0.8;
    rctx.setLineDash([4,4]);
    rctx.stroke();
    rctx.setLineDash([]);

    // Distance label on the right side
    const distLabel = Math.round(MAX_CM * f);
    rctx.fillStyle = '#2a6040';
    rctx.font = '10px monospace';
    rctx.textAlign = 'left';
    rctx.fillText(distLabel+'cm', cx+r+2, cy-2);
  });

  // ── Vertical centre line ──
  rctx.beginPath();
  rctx.moveTo(cx, cy);
  rctx.lineTo(cx, cy - maxR);
  rctx.strokeStyle = '#1a4028'; rctx.lineWidth = 0.8;
  rctx.stroke();

  // ── Sensor pair angular lines (pair 1 = left 25°, pair 2 = right 25°) ──
  const anglePair1 = -Math.PI/2 - 25*D2R;  // left of centre
  const anglePair2 = -Math.PI/2 + 25*D2R;  // right of centre
  [[anglePair1,'#00ff8840'],[anglePair2,'#ffaa0040']].forEach(([ang,col]) => {
    rctx.beginPath();
    rctx.moveTo(cx, cy);
    rctx.lineTo(cx + maxR*Math.cos(ang), cy + maxR*Math.sin(ang));
    rctx.strokeStyle = col; rctx.lineWidth = 1;
    rctx.stroke();
  });

  // ── Safety distance arc ──
  const safeR = (adaptSafeDist / MAX_CM) * maxR;
  rctx.beginPath();
  rctx.arc(cx, cy, safeR, Math.PI, 2*Math.PI);
  const safeGrad = rctx.createLinearGradient(cx-safeR,cy,cx+safeR,cy);
  safeGrad.addColorStop(0,'#e5584d80');
  safeGrad.addColorStop(0.5,'#f2b84b80');
  safeGrad.addColorStop(1,'#e5584d80');
  rctx.strokeStyle = safeGrad;
  rctx.lineWidth = 2;
  rctx.setLineDash([6,3]);
  rctx.stroke();
  rctx.setLineDash([]);
  // Safety label
  rctx.fillStyle = '#f2b84b';
  rctx.font = '10px monospace';
  rctx.textAlign = 'right';
  rctx.fillText('safe', cx-safeR-3, cy-2);

  // ── Helper: draw obstacle dots for one sensor pair ──
  function drawObstacleDots(dist, angle, color, trail, pairName) {
    const SHOW_DIST = adaptSafeDist * 3;  // dots visible up to 3x safe distance
    if (dist <= 0 || dist > SHOW_DIST) {
      // fade all trail dots then clear
      trail.forEach(p => p.age++);
      for (let i = trail.length-1; i>=0; i--) { if(trail[i].age > TRAIL_LEN) trail.splice(i,1); }
      return;
    }

    const r   = Math.min(dist / MAX_CM, 1.0) * maxR;
    const px  = cx + r * Math.cos(angle);
    const py  = cy + r * Math.sin(angle);

    // Add new dot to trail
    trail.push({x:px, y:py, age:0, dist});
    if (trail.length > TRAIL_LEN) trail.shift();

    // Draw trail dots (old → new, fading)
    trail.forEach((p, i) => {
      const frac = (i+1) / trail.length;
      const alpha = frac * frac * 0.85;
      const size  = 3 + frac*4;
      // Parse color and apply alpha
      rctx.beginPath();
      rctx.arc(p.x, p.y, size, 0, Math.PI*2);
      rctx.fillStyle = color.replace(')',`,${alpha})`).replace('rgb','rgba');
      rctx.fill();

      // Age the dot
      p.age++;
    });

    // Draw current (latest) dot with glow
    const glowR = 10;
    const glow = rctx.createRadialGradient(px,py,0,px,py,glowR);
    glow.addColorStop(0, color.replace(')',',0.9)').replace('rgb','rgba'));
    glow.addColorStop(1, color.replace(')',',0)').replace('rgb','rgba'));
    rctx.beginPath(); rctx.arc(px,py,glowR,0,Math.PI*2);
    rctx.fillStyle = glow; rctx.fill();
    rctx.beginPath(); rctx.arc(px,py,4,0,Math.PI*2);
    rctx.fillStyle = color; rctx.fill();

    // Remove aged-out trail dots
    for(let i=trail.length-1; i>=0; i--){ if(trail[i].age > TRAIL_LEN) trail.splice(i,1); }

    // Distance label next to current dot
    const isSafe = dist > adaptSafeDist + ADAPT_MARGIN;
    rctx.fillStyle = isSafe ? '#aaccaa' : '#ffaaaa';
    rctx.font = 'bold 11px monospace';
    rctx.textAlign = angle < -Math.PI/2 ? 'right' : 'left';
    const lx = px + (angle < -Math.PI/2 ? -8 : 8);
    rctx.fillText(Math.round(dist)+'cm', lx, py-6);
    rctx.fillStyle = '#7aaa8a';
    rctx.font = '10px monospace';
    rctx.fillText(pairName, lx, py+14);
  }

  drawObstacleDots(d1, anglePair1, 'rgb(0,255,136)',  trail1, 'TOF1+U1');
  drawObstacleDots(d2, anglePair2, 'rgb(255,170,0)',  trail2, 'TOF2+U2');

  // ── Drone icon at the base ──
  const ds = 12;
  rctx.save();
  rctx.translate(cx, cy);
  // Body
  rctx.fillStyle = '#5f8fb0';
  rctx.fillRect(-ds*0.4, -ds*0.2, ds*0.8, ds*0.4);
  // Arms
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sy]) => {
    rctx.beginPath();
    rctx.moveTo(0,0);
    rctx.lineTo(sx*ds*0.9, sy*ds*0.7);
    rctx.strokeStyle='#3a6f90'; rctx.lineWidth=2; rctx.stroke();
    rctx.beginPath(); rctx.arc(sx*ds*0.9, sy*ds*0.7, 4, 0, Math.PI*2);
    rctx.fillStyle='#2a4f70'; rctx.fill();
  });
  rctx.restore();
}

// ─────────────────────────────────────────────────────────────────────────
// Safety banner update
// ─────────────────────────────────────────────────────────────────────────
function updateSafetyBanner(d1, d2) {
  const minD = Math.min(
    d1 > 0 ? d1 : Infinity,
    d2 > 0 ? d2 : Infinity
  );
  const banner = $('safetyBanner');
  const safe = adaptSafeDist;

  if (minD === Infinity) {
    banner.className='safety-banner safe';
    banner.textContent = 'NO OBSTACLE';
  } else if (minD < safe - ADAPT_MARGIN) {
    banner.className='safety-banner danger';
    banner.textContent = `DANGER — ${Math.round(minD)} cm`;
  } else if (minD < safe + ADAPT_MARGIN) {
    banner.className='safety-banner caution';
    banner.textContent = `CAUTION — ${Math.round(minD)} cm`;
  } else {
    banner.className='safety-banner safe';
    banner.textContent = `SAFE — ${Math.round(minD)} cm`;
  }
}

// ─────────────────────────────────────────────────────────────────────────
// Incoming data handler
// ─────────────────────────────────────────────────────────────────────────
const num = v => typeof v === 'number' && isFinite(v);
let latestD1 = -1, latestD2 = -1;

function handle(d) {
  if (num(d.pitch) && num(d.roll) && num(d.yaw)) setAttitude(d.pitch, d.roll, d.yaw);

  Object.values(bars).forEach(b => {
    const v = d[b.key];
    if (num(v) && v > 0) {
      b.target = Math.min(v, MAX_CM*1.5);
      if (b.shown===null) b.shown = b.target;
      b.el.classList.remove('stale');
    } else if (b.target !== null) {
      b.el.classList.add('stale');
    }
  });

  // Update radar distances (use fused kalman for best accuracy)
  if (num(d.c1_kalman) && d.c1_kalman > 0) latestD1 = d.c1_kalman;
  if (num(d.c2_kalman) && d.c2_kalman > 0) latestD2 = d.c2_kalman;

  updateAdaptiveSafeDist(latestD1, latestD2);
  updateSafetyBanner(latestD1, latestD2);
}

// ─────────────────────────────────────────────────────────────────────────
// Render loop
// ─────────────────────────────────────────────────────────────────────────
let last = performance.now();
function frame(now) {
  const dt = Math.min((now-last)/1000, 0.1); last = now;
  const aBar  = 1 - Math.exp(-dt/TAU_BAR);
  const aAtt  = 1 - Math.exp(-dt/TAU_ATT);

  // Smooth bars
  Object.values(bars).forEach(b => {
    if (b.target===null) return;
    b.shown += (b.target-b.shown)*aBar;
    b.f.style.transform = `scaleY(${Math.min(b.shown/MAX_CM,1)})`;
    const txt = String(Math.round(b.shown));
    if (txt!==b.text){ b.v.textContent=txt; b.text=txt; }
    const cls = b.shown<BAD_CM?'f bad':b.shown<WARN_CM?'f warn':'f';
    if (cls!==b.cls){ b.f.className=cls; b.cls=cls; }
  });

  // Smooth radar distances
  if (bars.Lkalman.target!==null) rDist1 += (bars.Lkalman.target-rDist1)*aBar;
  if (bars.Rkalman.target!==null) rDist2 += (bars.Rkalman.target-rDist2)*aBar;

  // Redraw radar every frame
  drawRadar(rDist1>0?rDist1:-1, rDist2>0?rDist2:-1);

  // 3D attitude
  if (haveGL){ cur.slerp(tgt,aAtt); body.quaternion.copy(cur); renderer.render(scene,camera); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ─────────────────────────────────────────────────────────────────────────
// WebSocket
// ─────────────────────────────────────────────────────────────────────────
const statusEl=$('status'), btn=$('btnConn');
const setStatus=(t,c)=>{ statusEl.textContent=t; statusEl.className=c||''; };
let ws=null, wantOn=false, retry=null;
$('ip').value = store.get('ip','');
function openSocket(ip) {
  clearTimeout(retry);
  try{ ws=new WebSocket(`ws://${ip}:81`); } catch(e){ setStatus('Invalid address','err'); wantOn=false; return; }
  setStatus('Connecting…');
  ws.onopen  = ()=>{ setStatus('Live','ok'); btn.textContent='Disconnect'; };
  ws.onmessage=e=>{ try{ handle(JSON.parse(e.data)); } catch(_){} };
  ws.onclose = ()=>{
    if(wantOn){ setStatus('Connection lost, retrying…','err'); retry=setTimeout(()=>openSocket(ip),2000); }
    else { setStatus('Not connected'); btn.textContent='Connect'; }
  };
}
btn.onclick = () => {
  if(wantOn){ wantOn=false; clearTimeout(retry); if(ws)ws.close(); setStatus('Not connected'); btn.textContent='Connect'; return; }
  const ip=$('ip').value.trim();
  if(!ip){ setStatus('Enter the ESP32 IP address','err'); return; }
  stopDemo(); store.set('ip',ip); wantOn=true; openSocket(ip);
};
$('ip').addEventListener('keydown',e=>{ if(e.key==='Enter') btn.click(); });

// ─────────────────────────────────────────────────────────────────────────
// Demo mode
// ─────────────────────────────────────────────────────────────────────────
let demo = null;
function stopDemo(){ clearInterval(demo); demo=null; $('btnDemo').textContent='Demo'; }
$('btnDemo').onclick = () => {
  if(demo){ stopDemo(); setStatus('Not connected'); return; }
  if(wantOn) btn.click();
  $('btnDemo').textContent='Stop demo'; setStatus('Demo data','ok');
  const t0=performance.now();
  demo=setInterval(()=>{
    const t=(performance.now()-t0)/1000, n=s=>(Math.random()-.5)*s;
    // Simulate obstacle approaching on pair 1 (left) and slowly on pair 2
    const l = 50 + 40*Math.sin(t/3.0)+n(3);   // pair 1 oscillates 10-90 cm
    const r = 80 + 50*Math.cos(t/4.5)+n(3);   // pair 2 more distant
    handle({
      pitch: 15*Math.sin(t/1.7)+n(.4),
      roll:  20*Math.sin(t/2.1)+n(.4),
      yaw:   ((t*25)%360)+n(.4),
      c1_ultra: l+n(4), c1_tof: l+n(2), c1_kalman: l+n(1),
      c2_ultra: r+n(4), c2_tof: r+n(2), c2_kalman: r+n(1)
    });
  }, 33);
};
</script>
